<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>WxappRunner</title>
    <style>
      body {
        font: 14px system-ui;
        margin: 0;
        background: #fff;
        color: #242424;
      }
      main {
        padding: 24px;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      p {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      footer {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid #bbb;
        border-radius: 6px;
        background: #f8f8f8;
        padding: 8px 14px;
      }
      button:last-child {
        color: #168447;
      }
      p:empty {
        display: none;
      }
      input {
        font: inherit;
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      input[type="checkbox"] {
        width: auto;
        margin-right: 8px;
      }
      label {
        display: block;
        margin-top: 16px;
      }
      [role="alert"] {
        color: #b22222;
      }
    </style>
  </head>
  <body>
    <main role="dialog"></main>
    <script src="dialog-view.js"></script>
  </body>
</html>
